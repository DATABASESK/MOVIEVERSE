<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYTMOVIES — The Cinema</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#f4f4f4;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#webgl,#css3d{position:fixed;inset:0}
#webgl{z-index:2}
#css3d{z-index:1;pointer-events:none}
#movieFrame{width:1200px;height:675px;border:0;background:#000;display:block;box-shadow:0 0 80px rgba(0,0,0,.9)}
#top{display:none!important;position:fixed;z-index:20;left:0;right:0;top:0;height:70px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(5,6,8,.9);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 42px}
.brand{font-size:17px;font-weight:800;letter-spacing:.11em;display:flex;align-items:center;gap:10px}
.brandMark{font-size:22px;line-height:1;transform:skew(-10deg)}
.tabs{display:flex;gap:4px;border:1px solid #292c31;border-radius:24px;padding:3px;background:#0a0b0d}
.tab{padding:10px 17px;border-radius:19px;font-size:14px;color:#c8cbd0}
.tab.active{background:#f2f3f4;color:#111;box-shadow:0 0 20px rgba(255,255,255,.12)}
.site{padding:10px 16px;border:1px solid #30343a;border-radius:22px;font-size:13px;color:#ddd}
#crumb{display:none!important;position:fixed;z-index:20;left:28px;top:91px;color:#777e86;font-size:12px;letter-spacing:.1em}
